name: tests

on:
  push:
    branches:
      - main
      - staging
  # Only PRs INTO the two permanent branches. A bare `pull_request:` fires for a
  # PR targeting any branch, including one feature branch onto another.
  pull_request:
    branches:
      - main
      - staging

permissions:
  contents: read

# GitHub only reads workflows from the repository root, and always runs them
# from the repository root. The Laravel app is a subtree, so every step has to
# run inside it.
defaults:
  run:
    working-directory: application/source

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      # composer setup runs `artisan migrate --force`, and .env.example uses
      # sqlite. The database file is not committed, so create it first.
      - name: Create SQLite database
        run: touch database/database.sqlite

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check
