x-app-env: &app-env
  APP_NAME: ${APP_NAME:-Lead Lab}
  APP_ENV: ${APP_ENV:-production}
  APP_KEY: ${APP_KEY}
  APP_DEBUG: ${APP_DEBUG:-false}
  APP_URL: ${APP_URL}
  APP_LOCALE: ${APP_LOCALE:-en}
  LEAD_LAB_REQUIRE_EMAIL_VERIFICATION: ${LEAD_LAB_REQUIRE_EMAIL_VERIFICATION:-true}
  TRUSTED_PROXIES: ${TRUSTED_PROXIES:-*}
  # stderr, not the default `stack`: storage/logs is not a volume, so a
  # laravel.log written there dies with the container. On stderr the stack
  # trace lands in `docker compose logs <role>` beside the access log.
  LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
  LOG_LEVEL: ${LOG_LEVEL:-warning}
  DB_CONNECTION: mysql
  DB_HOST: db
  DB_PORT: 3306
  DB_DATABASE: ${DB_DATABASE:-leadlab}
  DB_USERNAME: ${DB_USERNAME:-leadlab}
  DB_PASSWORD: ${DB_PASSWORD}
  SESSION_DRIVER: database
  SESSION_DOMAIN: ${SESSION_DOMAIN:-}
  QUEUE_CONNECTION: database
  CACHE_STORE: database
  FILESYSTEM_DISK: ${FILESYSTEM_DISK:-local}
  MAIL_MAILER: smtp
  MAIL_HOST: ${MAIL_HOST}
  MAIL_PORT: ${MAIL_PORT:-587}
  MAIL_USERNAME: ${MAIL_USERNAME:-}
  MAIL_PASSWORD: ${MAIL_PASSWORD:-}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-no-reply@leadlab.test}
  MAIL_FROM_NAME: ${APP_NAME:-Lead Lab}

services:
  app:
    image: ${APP_IMAGE:-ghcr.io/adventistasia/lead-lab:latest}
    environment:
      <<: *app-env
      CONTAINER_ROLE: web
    # Loopback-only by default — this stack has no TLS/ingress decision yet
    # (D-49 is still Proposed). A reverse proxy or an explicit LAN override
    # is required to reach it from anywhere but the host itself.
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - storage:/app/storage/app/private
    restart: unless-stopped

  queue:
    image: ${APP_IMAGE:-ghcr.io/adventistasia/lead-lab:latest}
    environment:
      <<: *app-env
      CONTAINER_ROLE: queue
    # Waits on app's /up healthcheck, not just db — app runs `migrate
    # --force` on boot, and queue:work queries tables (e.g. `cache`, for its
    # restart-signal check) that don't exist until that finishes.
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["NONE"]
    volumes:
      - storage:/app/storage/app/private
    restart: unless-stopped

  scheduler:
    image: ${APP_IMAGE:-ghcr.io/adventistasia/lead-lab:latest}
    environment:
      <<: *app-env
      CONTAINER_ROLE: scheduler
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["NONE"]
    volumes:
      - storage:/app/storage/app/private
    restart: unless-stopped

  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-leadlab}
      MARIADB_USER: ${DB_USERNAME:-leadlab}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  db:
  storage:
